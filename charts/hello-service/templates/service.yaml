apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
spec:
  type: ClusterIP          # no LoadBalancer: access via kubectl port-forward (no AWS cost)
  selector:
    {{- include "hello.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
